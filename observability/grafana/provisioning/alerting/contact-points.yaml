apiVersion: 1
contactPoints:
  - orgId: 1
    name: homework-responder
    receivers:
      - uid: homework-responder
        type: webhook
        disableResolveMessage: false
        settings:
          url: http://host.docker.internal:8001/alerts
          httpMethod: POST
          maxAlerts: "10"
policies:
  - orgId: 1
    receiver: homework-responder
    group_by: [alertname, http_route]
    group_wait: 0s
    group_interval: 10s
    repeat_interval: 1h
