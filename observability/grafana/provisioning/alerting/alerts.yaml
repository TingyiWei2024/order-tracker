apiVersion: 1
groups:
  - orgId: 1
    name: order-tracker-5xx
    folder: Order Tracker
    interval: 10s
    rules:
      - uid: order-tracker-5xx
        title: OrderLookup5xx
        condition: C
        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange:
              from: 120
              to: 0
            model:
              datasource:
                type: prometheus
                uid: prometheus
              editorMode: code
              expr: 'sum by (http_route) (increase(order_lookup_requests_total{http_response_status_code=~"5.."}[2m])) or on (http_route) sum by (http_route) (0 * order_lookup_requests_total)'
              instant: true
              range: false
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: B
            datasourceUid: __expr__
            relativeTimeRange:
              from: 0
              to: 0
            model:
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              reducer: last
              type: reduce
              refId: B
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: C
            datasourceUid: __expr__
            relativeTimeRange:
              from: 0
              to: 0
            model:
              datasource:
                type: __expr__
                uid: __expr__
              expression: B
              type: threshold
              refId: C
              conditions:
                - evaluator:
                    params: [0]
                    type: gt
                  operator:
                    type: and
                  query:
                    params: [C]
                  reducer:
                    params: []
                    type: last
                  type: query
              intervalMs: 1000
              maxDataPoints: 43200
        dashboardUid: order-tracker
        panelId: 2
        noDataState: OK
        execErrState: Error
        for: 0s
        annotations:
          __dashboardUid__: order-tracker
          __panelId__: "2"
          summary: 'Order lookup 5xx on {{ $labels.http_route }}'
          description: 'HTTP 5xx counter increased over the last 2 minutes on {{ $labels.http_route }}. Evaluated every 10 seconds with no pending delay. Inspect the dashboard, correlated Loki logs and Tempo traces.'
          dashboard_url: http://localhost:3000/d/order-tracker?viewPanel=2
        labels:
          service: order-tracker
          severity: critical
        isPaused: false
